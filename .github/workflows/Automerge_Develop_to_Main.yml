name: Automerge Develop to Main

on:
  workflow_dispatch:
  schedule:
    # You can setup schedule here
    - cron: '0 12 * * *'
  push:
    branches:
      # develop
      - template/databrickshelloworld-1792097787844
      
permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 # Fetches all history for all branches

    - name: Configure Git
      run: |
        git config --global user.name "dinguyen-fi"
        git config --global user.email "di.nguyen@fi.com"

    - name: Merge develop into main    
      run: |
        # Switch to main branch
        git checkout main
        
        # Pull the latest changes from remote main
        git pull origin main
        
        # Merge develop into main
        # Using --no-ff creates a merge commit; change to --ff-only if preferred
        git merge origin/template/databrickshelloworld-1792097787844 --no-edit
        
        # Push the changes back to remote main
        git push origin main
          

